[project]
name = "adm0-site"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "duckdb>=2.0.0",
    "httpx2[http2]>=2.16.0",
    "tenacity>=9.2.1",
    "tylertoo>=0.8.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.3",
]

[tool.ruff]
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D213", "INP001", "S603", "S607", "S608"]
