name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: |
          [ -n "$TILES_URL" ] || { echo "TILES_URL secret is not set"; exit 1; }
          node scripts/seal-url.mjs
        env:
          TILES_URL: ${{ secrets.TILES_URL }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      - uses: actions/configure-pages@v6
        id: pages
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Check the tiles URL is not in the bundle
        env:
          TILES_URL: ${{ secrets.TILES_URL }}
        run: |
          if grep -rqF "$TILES_URL" dist; then echo "TILES_URL found in dist"; exit 1; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
